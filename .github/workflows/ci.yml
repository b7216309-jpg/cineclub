name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\Cineclub.slnx

      - name: Build
        run: dotnet build .\Cineclub.slnx -c Release --no-restore -warnaserror

      - name: Smoke test
        run: dotnet run --project .\Cineclub.Smoke -c Release --no-build
